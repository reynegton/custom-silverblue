name: Build and Push Custom Silverblue Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.github/keepalive.txt'
      - '.github/workflows/keepalive.yml'
  schedule:
    # Executa diariamente às 05:17 UTC (02:17 BRT) — minuto ímpar/fora de pico com ~1h50 de margem após as publicações do Fedora (~03:25 UTC)
    - cron: '17 5 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push OCI Image (Fedora ${{ matrix.fedora_version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - fedora_version: 45
            is_latest: true
          - fedora_version: 44
            is_latest: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.fedora_version }}
            type=raw,value=latest,enable=${{ matrix.is_latest }}
            type=sha,prefix=${{ matrix.fedora_version }}-,format=short

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          build-args: |
            FEDORA_MAJOR_VERSION=${{ matrix.fedora_version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=f${{ matrix.fedora_version }}
          cache-to: type=gha,mode=max,scope=f${{ matrix.fedora_version }}

      - name: Sign container image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"




