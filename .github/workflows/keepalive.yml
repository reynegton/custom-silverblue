name: Keepalive Workflow

on:
  schedule:
    # Executa a cada 25 dias às 00:00 UTC para manter as automações ativas
    - cron: '0 0 */25 * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Keepalive Ping
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Native Keepalive Ping
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git add .github/keepalive.txt
          git commit -m "chore: automated keepalive ping [skip ci]" || exit 0
          git push
