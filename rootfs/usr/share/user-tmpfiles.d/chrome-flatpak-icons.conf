# Garante que o diretório de ícones do Google Chrome (Flatpak) aponte para ~/.local/share/icons,
# evitando WebApps/PWAs sem ícone no launcher quando o .desktop usa caminho absoluto.
d %h/.local/share/icons 0755 - - -
d %h/.var/app/com.google.Chrome/data 0755 - - -
L %h/.var/app/com.google.Chrome/data/icons - - - - %h/.local/share/icons
